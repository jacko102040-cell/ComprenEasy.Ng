<header class="header-shell">
  <div class="header-card">
    <a class="brand" routerLink="/dashboard" aria-label="Ir al dashboard">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M3 8.5 12 4l9 4.5-9 4.5L3 8.5Z" />
          <path d="M6.5 10.3v4.6c1.6 1.4 3.4 2.1 5.5 2.1s3.9-.7 5.5-2.1v-4.6" />
        </svg>
      </span>
      <strong>ComprenEasy</strong>
    </a>

    <span class="header-divider" aria-hidden="true"></span>
    <img src="assets/img/logocolegio.png" alt="Insignia institucional" class="school-shield" />

    @if (authService.currentUser(); as user) {
      <nav class="nav-links" aria-label="Navegacion principal">
        @if (user.role === 'Teacher') {
          <a routerLink="/teacher/students" routerLinkActive="active">Panel docente</a>
          <a routerLink="/teacher/content" routerLinkActive="active">Contenido</a>
        } @else {
          <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Dashboard
          </a>
          <a routerLink="/readings" routerLinkActive="active">Lecturas PQ4R</a>
          @if (canShowPosttestLink()) {
            <a routerLink="/posttests" routerLinkActive="active">Posttest</a>
          }
        }
      </nav>

      <div class="user-box">
        <span class="user-name">{{ user.fullName }}</span>
        <span class="user-avatar" aria-hidden="true">{{ initials(user.fullName) }}</span>
        <button class="logout-button" type="button" (click)="logout()">Salir</button>
      </div>
    }
  </div>
</header>
